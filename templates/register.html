<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        注册账号 - ScriptHub Campus
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body class="auth-page">
    <nav class="navbar">
        <div class="nav-brand">
            <span class="nav-logo">📦</span>

            <a href="/">
                ScriptHub Campus
            </a>
        </div>

        <div class="nav-links">
            <a href="/">返回首页</a>

            <a href="/login">
                已有账号？登录
            </a>
        </div>
    </nav>

    <main class="auth-main">
        <section class="auth-card">
            <div class="auth-icon">👤</div>

            <span class="auth-kicker">
                CREATE ACCOUNT
            </span>

            <h1>创建账号</h1>

            <p class="auth-description">
                注册后可以上传脚本，
                并在“我的投稿”中查看审核状态。
            </p>

            {% if error %}
                <div
                    class="form-message
                    form-message-error"
                >
                    {{ error }}
                </div>
            {% endif %}

            <form
                method="post"
                class="auth-form"
            >
                <div class="form-group">
                    <label for="username">
                        用户名
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        value="{{ username }}"
                        minlength="3"
                        maxlength="30"
                        autocomplete="username"
                        required
                        autofocus
                    >

                    <p class="field-help">
                        3—30 个字符，
                        公开显示为脚本作者。
                    </p>
                </div>

                <div class="form-group">
                    <label for="password">
                        密码
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <p class="field-help">
                        至少 8 个字符。
                    </p>
                </div>

                <div class="form-group">
                    <label for="confirm_password">
                        确认密码
                    </label>

                    <input
                        id="confirm_password"
                        name="confirm_password"
                        type="password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="button
                    button-primary
                    auth-submit"
                >
                    注册并登录
                </button>
            </form>

            <p class="auth-switch">
                已经有账号？

                <a href="/login">
                    直接登录
                </a>
            </p>
        </section>
    </main>
</body>
</html>
