<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        用户登录 - ScriptHub Campus
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body class="auth-page">
    <nav class="navbar">
        <div class="nav-brand">
            <span class="nav-logo">📦</span>

            <a href="/">
                ScriptHub Campus
            </a>
        </div>

        <div class="nav-links">
            <a href="/">返回首页</a>
            <a href="/register">注册账号</a>
        </div>
    </nav>

    <main class="auth-main">
        <section class="auth-card">
            <div class="auth-icon">🔑</div>

            <span class="auth-kicker">
                WELCOME BACK
            </span>

            <h1>用户登录</h1>

            <p class="auth-description">
                普通用户和管理员共用此登录入口。
                登录后系统会根据账号角色进入对应页面。
            </p>

            {% if error %}
                <div
                    class="form-message
                    form-message-error"
                >
                    {{ error }}
                </div>
            {% endif %}

            <form
                method="post"
                class="auth-form"
            >
                <div class="form-group">
                    <label for="username">
                        用户名
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        value="{{ username }}"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        密码
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="button
                    button-primary
                    auth-submit"
                >
                    登录
                </button>
            </form>

            <p class="auth-switch">
                还没有账号？

                <a href="/register">
                    现在注册
                </a>
            </p>
        </section>
    </main>
</body>
</html>
