services:
  - type: web
    name: script-hub-campus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: Berry
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
